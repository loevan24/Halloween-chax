<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#05040b">
<title>PHANTOM — Chaxe</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:radial-gradient(ellipse at center,#171027 0%,#080711 55%,#020207 100%);
  color:#e9e3ff;font-family:Georgia,serif;overflow:hidden;
  display:flex;align-items:center;justify-content:center;text-align:center;
}
main{width:min(92vw,600px);padding:24px;position:relative;z-index:2}
h1{letter-spacing:10px;font-family:Arial,sans-serif;font-size:clamp(28px,8vw,48px);color:#c6b4ff;text-shadow:0 0 22px #986cff}
.subtitle{color:#8f83a8;letter-spacing:4px;font:11px Arial,sans-serif}
#ghost{height:270px;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.5) translateY(40px);transition:all 1.5s ease;filter:drop-shadow(0 0 28px #a68aff)}
#ghost.visible{opacity:1;transform:scale(1) translateY(0)}
.ghost-shape{position:relative;width:155px;height:190px;border-radius:48% 48% 35% 35%;background:linear-gradient(120deg,rgba(225,225,255,.9),rgba(129,111,185,.42) 55%,rgba(45,35,75,.12));box-shadow:inset -18px -5px 35px #514274,0 0 45px #8c70e8;animation:float 3s ease-in-out infinite}
.ghost-shape:after{content:"";position:absolute;bottom:-48px;left:0;width:100%;height:80px;background:linear-gradient(to bottom,rgba(180,166,255,.5),transparent);clip-path:polygon(0 0,100% 0,85% 45%,68% 20%,50% 65%,30% 20%,12% 55%)}
.eyes{position:absolute;top:72px;left:0;width:100%;display:flex;justify-content:center;gap:38px}
.eyes span{width:13px;height:20px;border-radius:50%;background:#24113d;box-shadow:0 0 13px #21103c}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
#status{font:12px Arial,sans-serif;letter-spacing:2px;color:#9c8cb9;margin:15px 0}
#message{min-height:70px;font-size:clamp(18px,4vw,23px);line-height:1.5;color:#eee7ff;text-shadow:0 0 12px #8e72d4}
button{margin-top:20px;border:1px solid #8d72c9;background:#211633;color:#eee7ff;padding:15px 24px;border-radius:30px;font-size:14px;letter-spacing:2px;cursor:pointer}
button:active{transform:scale(.97)}
#hint{font:11px Arial,sans-serif;color:#746987;line-height:1.7;margin-top:22px}
.wind{position:fixed;inset:-20%;pointer-events:none;opacity:0;background:repeating-linear-gradient(170deg,transparent 0 35px,rgba(190,180,255,.10) 36px,transparent 38px);transform:translateX(-100%);z-index:1}
.wind.active{opacity:1;animation:gust .8s linear 4}
@keyframes gust{to{transform:translateX(100%)}}
body.haunted{background:radial-gradient(ellipse at center,#29113c,#080711 65%,#020207)}
</style>
</head>
<body>
<div class="wind" id="wind"></div>
<main>
  <div class="subtitle">EXPÉRIENCE PARANORMALE</div>
  <h1>PHANTOM</h1>
  <div id="ghost"><div class="ghost-shape"><div class="eyes"><span></span><span></span></div></div></div>
  <div id="status">CHAXE EST EN SOMMEIL</div>
  <div id="message">Le silence règne… Prononce son invocation.</div>
  <button id="activate">ACTIVER LE MICRO</button>
  <div id="hint">Dis : « J'invoque ici le démon Chaxe »<br>Pour le renvoyer : « Démon Chaxe, disparais »<br><br>Garde cette page ouverte et ton écran allumé.</div>
</main>
<script>
const statusEl=document.getElementById("status");
const messageEl=document.getElementById("message");
const ghost=document.getElementById("ghost");
const button=document.getElementById("activate");
const wind=document.getElementById("wind");

const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
let recognition=null;
let listening=false;
let speaking=false;
let summoned=false;
let restarting=false;
let audioContext=null;

function normalize(s){
 return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[’']/g," ").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
}
function startListening(){
 if(!recognition||!listening||speaking||restarting)return;
 restarting=true;
 try{recognition.start()}catch(e){}
 setTimeout(()=>restarting=false,500);
}
function makeWind(){
 try{
  audioContext=audioContext||new (window.AudioContext||window.webkitAudioContext)();
  if(audioContext.state==="suspended")audioContext.resume();
  const length=audioContext.sampleRate*2;
  const buffer=audioContext.createBuffer(1,length,audioContext.sampleRate);
  const data=buffer.getChannelData(0);
  for(let i=0;i<length;i++)data[i]=Math.random()*2-1;
  const source=audioContext.createBufferSource();
  source.buffer=buffer;source.loop=true;
  const filter=audioContext.createBiquadFilter();
  filter.type="lowpass";filter.frequency.value=450;
  const gain=audioContext.createGain();
  gain.gain.setValueAtTime(0.001,audioContext.currentTime);
  gain.gain.linearRampToValueAtTime(0.20,audioContext.currentTime+0.5);
  gain.gain.linearRampToValueAtTime(0.001,audioContext.currentTime+3);
  source.connect(filter);filter.connect(gain);gain.connect(audioContext.destination);
  source.start();source.stop(audioContext.currentTime+3.1);
 }catch(e){}
}
function speak(text,after){
 if(!("speechSynthesis" in window)){messageEl.textContent=text; if(after)after();return;}
 speaking=true;
 try{recognition&&recognition.stop()}catch(e){}
 speechSynthesis.cancel();
 messageEl.textContent=text;
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="fr-FR";
 utterance.rate=0.82;
 utterance.pitch=0.55;
 utterance.volume=1;
 const voices=speechSynthesis.getVoices();
 const french=voices.find(v=>v.lang.toLowerCase().startsWith("fr"));
 if(french)utterance.voice=french;
 utterance.onend=()=>{
  speaking=false;
  if(after)after();
  setTimeout(startListening,700);
 };
 utterance.onerror=()=>{
  speaking=false;
  if(after)after();
  setTimeout(startListening,700);
 };
 speechSynthesis.speak(utterance);
}
function summon(){
 if(summoned)return;
 summoned=true;
 document.body.classList.add("haunted");
 ghost.classList.add("visible");
 statusEl.textContent="CHAXE EST PARMI NOUS";
 wind.classList.add("active");
 makeWind();
 setTimeout(()=>wind.classList.remove("active"),3500);
 speak("Je t'écoute… Parle, humain.");
}
function disappear(){
 if(!summoned)return;
 summoned=false;
 statusEl.textContent="CHAXE RETOURNE DANS LES TÉNÈBRES";
 wind.classList.add("active");
 makeWind();
 speak("Tu as de la chance, humain… Nous nous reverrons.",()=>{
  ghost.classList.remove("visible");
  document.body.classList.remove("haunted");
  statusEl.textContent="CHAXE EST EN SOMMEIL";
  messageEl.textContent="Le silence règne… Prononce son invocation.";
 });
}
function reply(text){
 const t=normalize(text);
 if(t.includes("demon chaxe disparais")||t.includes("chaxe disparais")||t.includes("disparais chaxe")){
  disappear();return;
 }
 if(!summoned){
  if(t.includes("invoque")&&t.includes("chaxe"))summon();
  return;
 }
 if(t.includes("bonbon")){
  if(t.includes("non")||t.includes("pas encore")||t.includes("trouve")){
   speak("Comment oses-tu revenir les mains vides… ? Je commence à perdre patience…");
  }else{
   speak("Les bonbons… Donne-les-moi, humain. Ne me fais pas attendre.");
  }
 }else if(t.includes("bonjour")||t.includes("salut")){
  speak("Ne me salue pas comme un ami… Je suis Chaxe, le maître des ombres.");
 }else if(t.includes("qui es tu")||t.includes("qui es tu")){
  speak("Je suis Chaxe. Une présence venue d'un endroit où la lumière ne va jamais.");
 }else if(t.includes("merci")){
  speak("Garde tes remerciements, humain. Ils ne m'intéressent guère.");
 }else if(t.includes("peur")){
  speak("Tu devrais avoir peur… Mais j'aime le courage. Pour l'instant.");
 }else{
  const replies=[
   "Hmm… Voilà qui est intéressant. Continue, humain.",
   "Je t'écoute. Choisis bien tes mots…",
   "Ha ha ha… Tu ignores à qui tu t'adresses.",
   "Les ombres m'ont murmuré quelque chose à ton sujet…",
   "Parle encore. Je ne suis pas d'humeur à attendre."
  ];
  speak(replies[Math.floor(Math.random()*replies.length)]);
 }
 if(Math.random()<0.18)setTimeout(()=>{if(summoned&&!speaking)speak("Ha… ha… ha…");},5000);
}

if(!SpeechRecognition){
 statusEl.textContent="RECONNAISSANCE VOCALE NON DISPONIBLE";
 messageEl.textContent="Essaie avec Google Chrome sur Android.";
 button.textContent="NAVIGATEUR INCOMPATIBLE";
 button.disabled=true;
}else{
 recognition=new SpeechRecognition();
 recognition.lang="fr-FR";
 recognition.continuous=true;
 recognition.interimResults=false;
 recognition.maxAlternatives=1;
 recognition.onstart=()=>{
  restarting=false;
  statusEl.textContent=summoned?"CHAXE T'ÉCOUTE":"EN VEILLE — J'ÉCOUTE L'INVOCATION";
  button.textContent="MICRO ACTIVÉ";
 };
 recognition.onresult=(event)=>{
  for(let i=event.resultIndex;i<event.results.length;i++){
   if(event.results[i].isFinal){
    const words=event.results[i][0].transcript.trim();
    if(words)reply(words);
   }
  }
 };
 recognition.onerror=(event)=>{
  if(event.error==="not-allowed"||event.error==="service-not-allowed"){
   listening=false;
   statusEl.textContent="ACCÈS AU MICRO REFUSÉ";
   messageEl.textContent="Autorise le micro dans les paramètres du navigateur, puis recharge la page.";
  }
 };
 recognition.onend=()=>{
  restarting=false;
  if(listening&&!speaking)setTimeout(startListening,800);
 };
}
button.addEventListener("click",()=>{
 if(!recognition)return;
 listening=true;
 button.textContent="DÉMARRAGE…";
 startListening();
});
</script>
</body>
</html>
